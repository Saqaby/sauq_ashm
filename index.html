<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سوق أسهم صقيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* هوية صقيل: كحلي + أزرق الألماسة + سماوي + عنبري للإبراز. تخطيط: شريط أسعار علوي، منصة الدور، شبكة أسهم، لوحة ترتيب */
  --navy:#1B4785; --blue:#298DCB; --blue-d:#1D6FA8; --sky:#78BFE2; --sky-l:#81D4F0; --deep:#0A4385;
  --ink:#12233D; --bg:#F3F7FB; --amber:#F2A63B; --amber-d:#9A5B00;
  --surface:#ffffff; --tint:#EAF3FB; --line:#D5E1EE; --muted:#566884;
  --up:#16844A; --up-bg:#E1F5EA; --down:#C23A3A; --down-bg:#FBE7E7;
  --shadow:0 1px 2px rgba(18,35,61,.05), 0 8px 24px -12px rgba(27,71,133,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{
  margin:0; min-height:100%; color:var(--ink);
  background-color:var(--bg);
  background-image:linear-gradient(to left, rgba(41,141,203,.06) 1px, transparent 1px), linear-gradient(to top, rgba(41,141,203,.06) 1px, transparent 1px);
  background-size:48px 48px;
  font-family:"Tajawal","Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;
  font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit; color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
.num{font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; display:inline-block}
.ico{width:1.25em; height:1.25em; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* ===== Header ===== */
.top{
  display:flex; align-items:center; gap:16px; padding:10px 22px;
  background:var(--surface); border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.8);
}
.logo-chip{display:flex; align-items:center; padding-inline-end:16px; border-inline-end:1px solid var(--line)}
.logo-chip img{height:46px; width:auto; display:block}
.candles{display:inline-flex; align-items:flex-end; gap:5px; height:30px}
.candles i{position:relative; width:8px; border-radius:2px; display:block}
.candles i::before{content:""; position:absolute; left:50%; width:2px; margin-left:-1px; top:-5px; bottom:-5px; background:inherit; border-radius:1px; opacity:.55}
.candles i:nth-child(1){height:11px; background:var(--down)}
.candles i:nth-child(2){height:17px; background:var(--up)}
.candles i:nth-child(3){height:13px; background:var(--down)}
.candles i:nth-child(4){height:26px; background:var(--up)}
.top h1{margin:0; font-size:1.45rem; font-weight:900; color:var(--navy); letter-spacing:0}
.top .spacer{flex:1}
.round-pill{
  background:var(--tint); color:var(--navy); border:1px solid var(--line); border-radius:999px; padding:5px 16px; font-weight:800; font-size:1rem;
}
.tbtn{
  border:1.5px solid var(--line); background:var(--surface); border-radius:12px; padding:8px 14px;
  font-weight:700; font-size:.95rem; display:inline-flex; align-items:center; gap:6px;
}
.tbtn:hover{border-color:var(--blue)}
.tbtn.danger{border-color:#E7B3B3; color:var(--down)}
.tbtn.danger:hover{background:var(--down-bg)}

/* ===== Ticker tape ===== */
.tape{background:var(--tint); color:var(--ink); overflow:hidden; white-space:nowrap; border-bottom:1px solid var(--line)}
.tape:empty{display:none}
.tape .run{display:inline-flex; animation:tape 38s linear infinite; will-change:transform}
.tape:hover .run{animation-play-state:paused}
.tape .it{display:inline-flex; align-items:center; gap:8px; padding:7px 18px; font-size:.95rem; font-weight:700; border-inline-end:1px solid var(--line)}
.tape .it .ico{color:var(--blue-d)}
.tape .it .p{font-weight:900; color:var(--navy)}
.tape .it .d{font-weight:800; font-size:.88rem}
.tape .it .d.up{color:var(--up)}
.tape .it .d.down{color:var(--down)}
.tape .it .d.flat{color:var(--muted)}
@keyframes tape{from{transform:translateX(0)} to{transform:translateX(50%)}}
.spark{display:block; width:100%; height:26px; margin-top:2px}
.spark path{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.spark .area{stroke:none; opacity:.14}

/* ===== Layout ===== */
.wrap{padding:18px 22px 28px; max-width:1500px; margin:0 auto}
.game{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start}
@media (max-width:980px){ .game{grid-template-columns:1fr} }

/* ===== Buttons ===== */
.btn{
  border:0; border-radius:14px; padding:16px 28px; font-size:1.25rem; font-weight:800;
  background:var(--navy); color:#fff; transition:transform .12s ease, filter .12s ease;
  box-shadow:0 6px 14px -8px rgba(27,71,133,.6);
}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4; box-shadow:none}
.btn.amber{background:var(--amber); color:#2a1a00; box-shadow:0 6px 14px -8px rgba(154,91,0,.7)}
.btn.ghost{background:var(--surface); color:var(--ink); border:2px solid var(--line); box-shadow:none}
.btn.big{font-size:1.6rem; padding:20px 36px; border-radius:18px}

/* ===== Setup ===== */
.setup{max-width:880px; margin:0 auto}
.panel{background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--navy); border-radius:20px; padding:28px; box-shadow:var(--shadow)}
.setup h2{margin:0 0 6px; font-size:2rem; font-weight:900; color:var(--navy)}
.lead{color:var(--muted); margin:0 0 22px}
.count-row{display:flex; align-items:center; gap:14px; margin-bottom:22px; flex-wrap:wrap}
.count-row label{font-weight:800; font-size:1.15rem}
.stepper{display:inline-flex; align-items:center; border:2px solid var(--line); border-radius:14px; overflow:hidden; background:var(--surface)}
.stepper button{width:52px; height:52px; border:0; background:var(--tint); font-size:1.6rem; font-weight:800; color:var(--navy)}
.stepper button:disabled{opacity:.35}
.stepper input{width:70px; height:52px; border:0; text-align:center; font-size:1.5rem; font-weight:900; background:var(--surface)}
.names{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; margin-bottom:24px}
.name-field{display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:6px 10px}
.name-field span{font-weight:800; color:var(--blue-d); min-width:24px; text-align:center}
.name-field input{flex:1; border:0; background:transparent; font-size:1.05rem; padding:8px 4px; font-weight:600; min-width:0}
.name-field input:focus{outline:none}
.name-field:focus-within{box-shadow:0 0 0 2px var(--blue); background:#fff}
.setup-actions{display:flex; gap:12px; flex-wrap:wrap}
.how h4{margin:0 0 14px}
.how ol{margin:0 0 6px; padding-inline-start:22px; display:flex; flex-direction:column; gap:10px}
.how li{font-size:1.02rem}
.how li b{color:var(--navy)}
.how .note{background:var(--tint); border-radius:12px; padding:10px 14px; margin-top:14px; font-size:.95rem; color:var(--muted)}
.modal.how{max-width:620px; max-height:82vh; overflow:auto}

/* ===== Stage ===== */
.stage{
  background:linear-gradient(180deg,#fff 0%, var(--tint) 100%);
  color:var(--ink); border:1px solid var(--line); border-top:4px solid var(--navy);
  border-radius:22px; padding:26px 30px; position:relative; overflow:hidden; box-shadow:var(--shadow);
}
.stage::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(to left, rgba(41,141,203,.07) 1px, transparent 1px), linear-gradient(to top, rgba(41,141,203,.07) 1px, transparent 1px);
  background-size:52px 52px;
}
.stage::after{ /* ضلع ألماسة الشعار */
  content:""; position:absolute; inset-inline-start:-90px; bottom:-130px; width:320px; height:320px;
  background:conic-gradient(from 45deg, rgba(129,212,240,.38), rgba(41,141,203,.10), rgba(129,212,240,.30), rgba(41,141,203,.08));
  transform:rotate(45deg); border-radius:28px; pointer-events:none;
}
.stage > *{position:relative; z-index:1}
.meta{display:flex; gap:10px; flex-wrap:wrap; font-weight:700; color:var(--blue-d); font-size:1.15rem}
.meta .sep{opacity:.4}
.order-strip{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px}
.order-strip span{font-size:.85rem; padding:3px 10px; border-radius:999px; background:#fff; border:1px solid var(--line); color:var(--muted)}
.order-strip span.done{opacity:.5}
.order-strip span.now{background:var(--amber); border-color:var(--amber); color:#2a1a00; font-weight:800}
.team-name{font-size:clamp(2.6rem,6vw,4.6rem); font-weight:900; line-height:1.15; margin:18px 0 6px; color:var(--navy)}
.bal-label{color:var(--muted); font-weight:700; font-size:1.1rem}
.bal{font-size:clamp(2rem,4.5vw,3.2rem); font-weight:900; color:var(--ink)}
.bal small{font-size:.5em; font-weight:700; color:var(--muted); margin-inline-start:6px}
.answer-btns{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:26px}
.abtn{
  border:2px solid transparent; border-radius:20px; padding:26px 16px; font-size:clamp(1.4rem,2.6vw,2rem); font-weight:900;
  display:flex; align-items:center; justify-content:center; gap:12px; transition:transform .12s ease, filter .12s;
}
.abtn:active{transform:scale(.98)}
.abtn:hover{filter:brightness(1.05)}
.abtn.ok{background:var(--up); color:#fff; box-shadow:0 10px 20px -12px rgba(22,132,74,.8)}
.abtn.no{background:#fff; color:var(--down); border-color:#E7B3B3}
.abtn i{font-style:normal; font-size:1.3em; line-height:1}

.stage-enter{animation:stageIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes stageIn{from{opacity:0; transform:translateX(-40px)} to{opacity:1; transform:none}}

/* Reward */
.reward{text-align:center; padding:12px 0 4px}
.reward .label{font-size:1.5rem; font-weight:800; color:var(--blue-d)}
.reward .amount{font-size:clamp(4.2rem,11vw,8rem); font-weight:900; color:var(--up); line-height:1.1; margin:6px 0}
.reward .amount.zero{color:var(--muted); font-size:clamp(2.4rem,6vw,4rem)}
.reward .newbal{font-size:1.3rem; color:var(--ink)}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6); opacity:0} to{transform:scale(1); opacity:1}}
.center-actions{display:flex; justify-content:center; margin-top:22px}

/* ===== Market ===== */
.mk-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
.mk-head .team-name{font-size:clamp(1.8rem,3.4vw,2.6rem); margin:4px 0 0}
.stage.mk{padding:18px 22px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff; border:1px solid var(--line); border-radius:14px; padding:8px 14px}
.stat .k{color:var(--muted); font-weight:700; font-size:.95rem}
.stat .v{font-size:1.7rem; font-weight:900; color:var(--navy)}
.stat.hl{background:#FFF6E6; border-color:#F2D29C}
.stat.hl .v{color:var(--ink)}
.moves-dots{display:none}

.market-area{margin-top:12px}
.cos{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px}
@media (max-width:1180px){.cos{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.cos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.co{
  background:var(--surface); color:var(--ink); border:1.5px solid var(--line); border-radius:16px;
  padding:9px 11px 8px; text-align:start; display:flex; flex-direction:column; gap:2px;
  transition:border-color .12s, transform .12s, box-shadow .12s;
}
.co:hover:not(:disabled){border-color:var(--blue); box-shadow:0 8px 18px -12px rgba(27,71,133,.5)}
.co.lock{opacity:.55}
.co .lk{font-size:.78rem; font-weight:800; color:var(--amber-d)}
.co.sel{border-color:var(--navy); box-shadow:0 0 0 3px rgba(41,141,203,.30)}
.co .nm{font-weight:800; font-size:1.02rem; display:flex; align-items:center; gap:8px}
.co .ic{display:inline-grid; place-items:center; width:30px; height:30px; border-radius:9px; background:var(--tint); color:var(--blue-d); flex:none}
.co.sel .ic{background:var(--navy); color:#fff}
.co .pr{font-size:1.45rem; font-weight:900; line-height:1.15; color:var(--navy)}
.co .pr small{font-size:.55em; color:var(--muted); font-weight:700}
.chg{font-weight:800; font-size:.92rem; border-radius:8px; padding:1px 8px; align-self:flex-start}
.chg.up{color:var(--up); background:var(--up-bg)}
.chg.down{color:var(--down); background:var(--down-bg)}
.chg.flat{color:var(--muted); background:var(--tint)}
.co .own{font-size:.85rem; color:var(--muted); margin-top:3px; border-top:1px dashed var(--line); padding-top:5px}
.co .own b{color:var(--ink)}

.trade{
  margin-top:12px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-inline-start:5px solid var(--navy);
  border-radius:16px; padding:12px 18px;
  display:grid; grid-template-columns:minmax(0,1.2fr) auto minmax(0,1fr) auto; gap:18px; align-items:center;
}
@media (max-width:900px){.trade{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.trade{grid-template-columns:1fr}}
.trade .tco{font-size:1.4rem; font-weight:900; color:var(--navy); display:flex; align-items:center; gap:8px}
.trade .tsub{color:var(--muted); font-size:.95rem}
.seg{display:inline-flex; background:var(--tint); border-radius:14px; padding:4px}
.seg button{border:0; background:transparent; padding:10px 22px; font-size:1.15rem; font-weight:800; border-radius:11px; color:var(--muted)}
.seg button.on.buy{background:var(--up); color:#fff}
.seg button.on.sell{background:var(--down); color:#fff}
.qty{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.qty .stepper input{width:84px}
.qty .max{border:0; background:var(--tint); border-radius:10px; padding:10px 12px; font-weight:800; font-size:.95rem; color:var(--navy)}
.total .k{color:var(--muted); font-size:.95rem}
.total .v{font-size:1.6rem; font-weight:900; color:var(--navy)}
.total .err{color:var(--down); font-weight:800; font-size:.95rem; min-height:1.4em}
.exec{min-width:170px}
.exec.buy{background:var(--up)}
.exec.sell{background:var(--down)}
.hint{margin-top:12px; background:#fff; border:1px dashed #9CC3E2; border-radius:14px; padding:14px 18px; font-weight:700; color:var(--muted)}
.mk-foot{display:flex; justify-content:flex-end; margin-top:16px}

/* ===== Market update ===== */
.upd-title{font-size:clamp(2.4rem,5vw,3.6rem); font-weight:900; text-align:center; margin:6px 0 4px; color:var(--navy)}
.upd-sub{text-align:center; color:var(--blue-d); font-weight:700; margin-bottom:18px}
.upd-grid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px}
@media (max-width:1000px){.upd-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.upd{background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:14px; padding:12px; opacity:0; animation:fadeUp .4s ease forwards; display:flex; flex-direction:column; gap:2px; align-items:flex-start}
.upd .nm{font-weight:800; display:flex; align-items:center; gap:6px; color:var(--navy)}
.upd .nm .ico{color:var(--blue-d)}
.upd .path{color:var(--muted); font-size:.95rem}
.upd .pr{font-size:1.6rem; font-weight:900; color:var(--navy)}
@keyframes fadeUp{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
.scan{height:6px; border-radius:6px; background:var(--line); overflow:hidden; margin:30px auto; max-width:420px}
.scan i{display:block; height:100%; width:40%; background:var(--blue); border-radius:6px; animation:scan 1s ease-in-out infinite alternate}
@keyframes scan{from{margin-inline-start:0} to{margin-inline-start:60%}}

/* ===== Leaderboard ===== */
.board{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px 16px; position:sticky; top:14px; box-shadow:var(--shadow)}
.board h3{margin:0 0 10px; font-size:1.2rem; font-weight:900; color:var(--navy); display:flex; justify-content:space-between; align-items:baseline}
.board h3 small{font-size:.8rem; color:var(--muted); font-weight:600}
.board ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.board li{display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:8px; align-items:center; padding:9px 10px; border-radius:12px; background:var(--bg)}
.board li .rk{font-weight:900; color:var(--blue-d); text-align:center}
.board li .tn{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.board li .tw{font-weight:900; color:var(--navy)}
.board li.cur{box-shadow:inset 0 0 0 2px var(--blue); background:var(--tint)}
.board li.cur .rk{background:var(--blue); color:#fff; border-radius:8px}
.board li.flash{animation:flash .9s ease}
@keyframes flash{0%{background:rgba(242,166,59,.5)}100%{background:var(--bg)}}

/* ===== Order & final ===== */
.order-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin:20px 0 26px; padding:0; list-style:none}
.order-list li{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; gap:12px; align-items:center; font-size:1.3rem; font-weight:800; color:var(--navy); opacity:0; animation:fadeUp .35s ease forwards}
.order-list li b{background:var(--amber); color:#2a1a00; width:38px; height:38px; border-radius:10px; display:grid; place-items:center; flex:none}
.final{max-width:980px; margin:0 auto}
.winner{text-align:center; padding:34px 20px 30px}
.winner .cup{display:flex; justify-content:center; color:var(--blue)}
.winner .cup svg{width:84px; height:84px}
.winner .lbl{color:var(--blue-d); font-weight:800; font-size:1.4rem; margin-top:6px}
.winner .wn{font-size:clamp(2.8rem,7vw,5.2rem); font-weight:900; line-height:1.15; margin:8px 0; color:var(--navy)}
.winner .wb{font-size:clamp(2rem,4.5vw,3rem); font-weight:900; color:var(--up)}
.ranking{margin-top:18px}
.ranking h3{font-size:1.4rem; margin:0 0 12px; font-weight:900; color:var(--navy)}
.rk-row{display:grid; grid-template-columns:50px minmax(0,1fr) auto; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:8px; font-size:1.2rem}
.rk-row .p{font-weight:900; color:var(--blue-d); font-size:1.4rem; text-align:center}
.rk-row .n{font-weight:800}
.rk-row .n small{display:block; font-size:.8rem; color:var(--muted); font-weight:600}
.rk-row .b{font-weight:900; font-size:1.4rem; color:var(--navy)}

/* ===== Modal & toasts ===== */
.modal-bg{position:fixed; inset:0; background:rgba(18,35,61,.40); display:grid; place-items:center; z-index:50; padding:20px; animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface); color:var(--ink); border-radius:20px; padding:28px; max-width:520px; width:100%; animation:pop .3s cubic-bezier(.2,1.3,.4,1); box-shadow:0 30px 60px -20px rgba(18,35,61,.45)}
.modal h4{margin:0 0 10px; font-size:1.5rem; font-weight:900; color:var(--navy)}
.modal p{margin:0 0 22px; color:var(--muted); font-size:1.1rem}
.modal .acts{display:flex; gap:10px; justify-content:flex-start; flex-wrap:wrap}
.modal .btn{font-size:1.1rem; padding:13px 22px}
.btn.red{background:var(--down)}
.toasts{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:20px; display:flex; flex-direction:column; gap:8px; z-index:60}
.toast{background:var(--navy); color:#fff; padding:12px 18px; border-radius:14px; font-weight:700; box-shadow:0 8px 24px rgba(18,35,61,.22); animation:tin .25s ease}
.toast.ok{background:var(--up); color:#fff}
.toast.err{background:var(--down); color:#fff}
@keyframes tin{from{opacity:0; transform:translateY(10px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition:none !important}
  .upd,.order-list li{opacity:1}
  .tape .run{animation:none}
}
@media (max-width:640px){
  .top{padding:8px 12px; gap:8px; flex-wrap:wrap}
  .top h1{font-size:1.1rem}
  .logo-chip img{height:34px}
  .logo-chip{padding-inline-end:10px}
  .wrap{padding:12px}
  .stage{padding:18px}
  .answer-btns{grid-template-columns:1fr}
  .tbtn .lbl{display:none}
}

/* ===== v2: إعدادات المسابقة ===== */
.sec{margin:22px 0 10px; font-size:1.15rem; font-weight:900; color:var(--navy); display:flex; align-items:center; gap:10px}
.sec::after{content:""; flex:1; height:1px; background:var(--line)}
.sec:first-of-type{margin-top:4px}
.sub{margin:10px 0 8px; color:var(--muted); font-weight:700; font-size:.98rem}
.cfg-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; align-items:end}
.fld{display:flex; flex-direction:column; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.fld > span{font-weight:800; font-size:.95rem; color:var(--navy)}
.fld input{border:0; background:transparent; font-size:1.25rem; font-weight:900; padding:4px 0; min-width:0; width:100%}
.fld input:focus{outline:none}
.fld:focus-within{box-shadow:0 0 0 2px var(--blue); background:#fff}
.fld small{color:var(--muted); font-size:.8rem}
.fld .stepper{align-self:flex-start}
.fld .stepper input{width:60px; height:44px; padding:0; text-align:center}
.fld .stepper button{width:44px; height:44px}
/* ===== شريط الأخبار ===== */
.news{display:flex; align-items:stretch; background:#fff; border-bottom:1px solid var(--line)}
.news .lbl{flex:none; background:var(--navy); color:#fff; font-weight:800; padding:7px 18px; font-size:.95rem; display:flex; align-items:center; position:relative; z-index:1}
.news .scroll{flex:1; overflow:hidden; white-space:nowrap; min-width:0}
.news .run{display:inline-flex; animation:tape 60s linear infinite; will-change:transform}
.news:hover .run{animation-play-state:paused}
.news .it{display:inline-flex; align-items:center; gap:8px; padding:7px 22px; font-size:.98rem; font-weight:600; border-inline-end:1px solid var(--line)}
.news .it b{color:var(--navy); font-weight:900}
.dot{width:10px; height:10px; border-radius:50%; flex:none; background:var(--muted)}
.dot.up{background:var(--up)} .dot.down{background:var(--down)}
.newsbox{margin-top:16px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 16px}
.newsbox h4{margin:0 0 8px; color:var(--navy); font-size:1.05rem; font-weight:900}
.newsbox ul{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:6px 18px}
.newsbox li{display:flex; align-items:center; gap:8px; font-size:.98rem}
.newsbox li b{color:var(--navy)}
.nwtag.up{color:var(--up); font-weight:800} .nwtag.down{color:var(--down); font-weight:800}
/* ===== المؤقت ===== */
.qrow{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
.tmr{display:inline-flex; align-items:center; gap:12px; background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:8px 14px; min-height:52px}
.tmr .tl{font-weight:700; color:var(--muted); font-size:.95rem}
.tmr .t{font-size:1.9rem; font-weight:900; color:var(--navy); line-height:1}
.tmr .bar{width:110px; height:8px; border-radius:6px; background:var(--tint); overflow:hidden}
.tmr .bar i{display:block; height:100%; background:var(--blue); border-radius:6px}
.tmr.warn{border-color:var(--amber)} .tmr.warn .t{color:var(--amber-d)} .tmr.warn .bar i{background:var(--amber)}
.tmr.crit{border-color:var(--down)} .tmr.crit .t{color:var(--down)} .tmr.crit .bar i{background:var(--down)}
.tmr.crit .t{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.mk-head .tmr{margin-inline-start:auto}
/* ===== أزرار المستويات ===== */
.answer-btns{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.abtn.ok{font-size:clamp(1.15rem,2vw,1.5rem); padding:18px 12px}
.abtn .lvt{display:flex; flex-direction:column; align-items:center; line-height:1.25}
.abtn .lvt small{font-size:.8em; font-weight:700; opacity:.9}
.abtn.no{grid-column:1/-1; padding:18px 16px}
.abtn:disabled{opacity:.4; cursor:not-allowed; filter:none}
.setup-actions{margin-top:28px}
.cfg-grid{align-items:stretch}
.fld input[type=number]{text-align:start}

/* ===== v3: كل شاشة تتسع في الشاشة الواحدة (للبروجكتر) ===== */
html,body{height:100%}
body{display:flex; flex-direction:column; overflow:hidden}
.top,.tape,.news{flex:none}
.wrap{flex:1; min-height:0; overflow:auto; width:100%; max-width:1760px; margin:0 auto; padding:14px 22px 16px; display:flex; flex-direction:column}
#app{margin-block:auto; width:100%}
.setup{max-width:1180px}
.panel{padding:22px 26px}
.setup-cols{display:grid; grid-template-columns:1fr 1fr; gap:30px}
@media (max-width:900px){.setup-cols{grid-template-columns:1fr}}
.setup h2{font-size:1.7rem}
.lead{margin-bottom:10px}
.names{grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); margin-bottom:6px}
.news .bul{width:8px; height:8px; background:var(--blue); transform:rotate(45deg); flex:none}
/* اختيار المستوى */
.pick-title{margin:22px 0 12px; font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:900; color:var(--navy)}
.pick-title small{font-size:.55em; font-weight:700; color:var(--muted); margin-inline-start:8px}
.lv-btns{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px}
.lvbtn{border:2px solid var(--line); background:#fff; border-radius:20px; padding:24px 12px; display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:var(--shadow); transition:transform .12s, border-color .12s}
.lvbtn:hover{border-color:var(--blue); transform:translateY(-2px)}
.lvbtn:active{transform:scale(.98)}
.lvbtn .ln{font-size:clamp(1.5rem,2.4vw,2.2rem); font-weight:900; color:var(--navy)}
.lvbtn .la{font-size:clamp(1.3rem,2vw,1.9rem); font-weight:900; color:var(--up)}
.lvbtn .la small{font-size:.6em; color:var(--muted)}
.lvchip{background:var(--navy); color:#fff; font-weight:800; font-size:1.2rem; border-radius:999px; padding:8px 20px}
/* العداد الكبير */
.tmr.big{display:flex; flex-direction:column; align-items:center; gap:6px; margin:16px auto 0; width:min(100%,620px); padding:14px 28px 18px; border-radius:22px; border-width:2px}
.tmr.big .tl{font-size:1.15rem}
.tmr.big .t{font-size:clamp(4.5rem,13vh,8.5rem); letter-spacing:.02em}
.tmr.big .bar{width:100%; height:14px}
.tmr.big .tbtn{font-size:1.2rem; padding:10px 22px}
.tmr.lg .t{font-size:2.7rem}
.tmr.lg .bar{width:150px; height:10px}
.tmr.lg{padding:8px 18px}
.answer-btns.two{grid-template-columns:1fr 1fr; margin-top:16px}
.answer-btns.two .abtn.no{grid-column:auto}
.answer-btns.two .abtn{font-size:clamp(1.4rem,2.6vw,2rem); padding:22px 16px}

/* ===== v3.1: العمود الجانبي يستوعب لوحة التداول وأخبار التحديث ===== */
.side{display:flex; flex-direction:column; gap:14px; align-self:start}
.side .board{position:static}
.board ol{position:relative; max-height:34vh; overflow-y:auto}
.side .trade{margin-top:0; grid-template-columns:1fr; gap:12px; border-inline-start:1px solid var(--line); border-top:4px solid var(--navy); box-shadow:var(--shadow)}
.side .trade .seg{display:flex} .side .trade .seg button{flex:1}
.side .trade .qty{flex-direction:column; align-items:stretch}
.side .trade .exec{width:100%}
.side .hint{margin-top:0}
.side .newsbox{margin-top:0; box-shadow:var(--shadow)}
.side .newsbox ul{grid-template-columns:1fr}
.side .newsbox li{align-items:flex-start}
.side .newsbox li b{white-space:nowrap}

/* ===== v3.2: ضغط العمود الجانبي ===== */
.side .board{padding:12px 12px}
.side .board h3{margin-bottom:8px; font-size:1.1rem}
.side .board ol{gap:4px; max-height:30vh}
.side .board li{padding:6px 10px}
.side .trade{padding:10px 14px; gap:8px}
.side .trade .tco{font-size:1.2rem}
.side .trade .seg button{padding:7px 14px; font-size:1.05rem}
.side .trade .qty{flex-direction:row; flex-wrap:wrap; align-items:center; gap:8px}
.side .trade .stepper button{width:40px; height:40px}
.side .trade .stepper input{height:40px; width:64px; font-size:1.25rem}
.side .trade .qty .max{padding:8px 12px; flex:1}
.side .trade .total{flex-basis:100%}
.side .trade .total .v{font-size:1.4rem}
.side .trade .total .err{min-height:1.1em}
.side .trade .btn{padding:11px 20px; font-size:1.15rem}

/* ===== v3.3: ضغط شاشتي السوق والتحديث ===== */
.upd-title{font-size:clamp(1.8rem,4.2vh,2.8rem); margin:0}
.upd-sub{margin-bottom:10px}
.upd{padding:9px 12px}
.upd .pr{font-size:1.45rem}
.stage:has(.upd-grid) .center-actions{margin-top:12px}
.stage:has(.upd-grid) .btn.big{padding:12px 30px; font-size:1.35rem}
.stage:has(.upd-grid){padding:18px 24px}
.spark{height:20px}
.co{padding:8px 11px 7px}
.stage.mk{padding:14px 20px}
.mk-head .team-name{margin:0}
.stats{margin-top:6px}
.market-area{margin-top:8px}

.side .newsbox{padding:10px 12px}
.side .newsbox h4{font-size:.98rem; margin-bottom:6px}
.side .newsbox ul{gap:5px}
.side .newsbox li{font-size:.88rem; line-height:1.3}
.side .board ol{max-height:26vh}

/* ===== ألوان المستويات ===== */
.easy{--c:#16844A; --t:#E4F6EB} .mid{--c:#A85F00; --t:#FFF3DC} .hard{--c:#C23A3A; --t:#FCE9E9}
.lvbtn{border-color:var(--c); background:var(--t); position:relative; overflow:hidden}
.lvbtn::before{content:""; position:absolute; inset-inline:0; top:0; height:8px; background:var(--c)}
.lvbtn .ln{color:var(--c)}
.lvbtn .la{color:var(--ink)}
.lvchip{background:var(--c,var(--navy))}
.fld .lvl{display:flex; align-items:center; gap:8px; color:var(--c)}
.fld .lvl::before{content:""; width:12px; height:12px; border-radius:50%; background:var(--c)}
.seg button.on:not(.buy):not(.sell){background:var(--navy); color:#fff}
#lSeg{align-self:flex-start}
.fld.wide{grid-column:1/-1}
#lSeg button{white-space:nowrap}
.one{--c:#1B4785; --t:#EAF3FB}
</style>
</head>

/* ================== الأخبار ================== */
/* أخبار افتراضية بصياغة صحفية محايدة: الاتجاه والشركة المعنية لا يُعلنان، ويُستنتجان من المضمون.
   لكل خبر أثر مخفي يُطبَّق على الأسعار عند تحديث السوق، وأخبار الضجيج بلا أثر. */
const NEWS = {
  transport:{up:["هيئة النقل تعتمد إضافة مسارات جديدة داخل الأحياء السكنية","أعداد الركاب في الأيام الدراسية تتجاوز أرقام الفصل الماضي"],down:["مراجعة رسمية لجداول التشغيل بعد ملاحظات من المستخدمين","ارتفاع أسعار قطع الغيار المستوردة للمركبات الثقيلة"]},
  power:{up:["ربط مدينة صناعية جديدة بالشبكة الوطنية خلال الربع القادم","الانتهاء من تحديث وحدتين في محطة التوليد الشمالية"],down:["الجهة المنظمة تدرس تعديل تعرفة الاستهلاك التجاري","ارتفاع أسعار الوقود المستخدم في التوليد"]},

  telecom:{up:["زيادة عدد المشتركين في باقات الألياف الضوئية","اتفاق لتوسيع التغطية في المناطق الطرفية"],down:["الجهة المنظمة تفتح تحقيقًا في شكاوى انقطاع الخدمة","دخول مشغّل جديد بباقات منخفضة السعر"]},
  energy:{up:["ارتفاع الطلب العالمي على الطاقة مع بداية موسم الشتاء","الإعلان عن اكتشاف جديد في حقل قيد التطوير"],down:["تأجيل مشروع توسعة لمصفاة رئيسية إلى العام المقبل","اعتدال درجات الحرارة يخفض الاستهلاك عن المتوقع"]},
  tech:{up:["جهة حكومية تطلب عروضًا لمشاريع التحول الرقمي","إطلاق الجيل الجديد من الخدمات السحابية للمنشآت"],down:["تحذيرات من ثغرة أمنية في أنظمة شائعة الاستخدام","تأجيل طرح منتج منتظر لحين استكمال الاختبارات"]},

  health:{up:["افتتاح مجمّع طبي جديد بسعة أسرّة أكبر","توسيع نطاق التأمين الصحي ليشمل خدمات إضافية"],down:["تأخر اعتماد ترخيص خدمة تخصصية جديدة","نقص في الكوادر التمريضية بعدد من المنشآت"]},

  logistics:{up:["افتتاح مركز توزيع جديد قرب الميناء","نمو الطلبات الإلكترونية يرفع حجم الشحنات"],down:["ازدحام في الميناء يؤخر تفريغ الحاويات","ارتفاع أسعار وقود الشاحنات"]},
};
const NEWS_GENERAL = {up:["نمو الإنفاق الاستهلاكي يتجاوز تقديرات الربع الماضي","إعلان تسهيلات تمويلية جديدة للمنشآت الصغيرة والمتوسطة"],down:["ارتفاع معدل التضخم الشهري إلى أعلى مستوى في ستة أشهر","تباطؤ نمو الصادرات غير النفطية"]};
const NEWS_NOISE = ["اجتماع دوري لوزراء المالية يناقش خطط العام المقبل","افتتاح معرض الاستثمار السنوي بمشاركة عدد من الدول","إعلان مواعيد نشر النتائج المالية للربع الحالي","البنوك تعلن ساعات عمل جديدة خلال الإجازة","تقرير: ارتفاع أعداد المستثمرين الجدد في السوق المالية"];
const NEWS_UP_P = 0.62;   // ميل الأخبار إلى الإيجابية
const pick = a => a[Math.floor(Math.random()*a.length)];
function genNews(){
  const prev = new Set(((S&&S.news)||[]).map(n=>n.text));
  const fresh = a => { const f = a.filter(t=>!prev.has(t)); return pick(f.length?f:a); };
  const out = shuffle(COMPANIES.map(c=>c.id)).slice(0,3).map(id => {
    const up = Math.random()<NEWS_UP_P;
    return {co:id, up, text:fresh(NEWS[id][up?"up":"down"]), eff:(up?1:-1)*(0.04+Math.random()*0.06)};
  });
  const gu = Math.random()<NEWS_UP_P;
  out.push({co:null, up:gu, text:fresh(NEWS_GENERAL[gu?"up":"down"]), eff:(gu?1:-1)*(0.015+Math.random()*0.02)});
  out.push({co:null, up:null, text:fresh(NEWS_NOISE), eff:0});
  return shuffle(out);
}

/* ================== أدوات ================== */
const fmt = n => Math.round(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));

/* ================== منطق اللعبة ================== */
let S = null;          // حالة اللعبة
let UI = {sel:null, mode:"buy", qty:1, animReward:false, setupCount:4, setupNames:[], timer:null, cfg:JSON.parse(JSON.stringify(DEFAULT_CFG))};

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function newGame(names, cfg){
  const teams = shuffle(names).map((n,i) => ({id:"t"+i, name:n, cash:cfg.cash, holdings:{}}));
  S = {
    v:2, phase:"order", round:1, cur:0, movesLeft:MAX_MOVES, lastReward:null, lastChanges:null, final:null,
    cfg:{cash:cfg.cash, levels:cfg.levels, rewards:cfg.rewards.slice(0,cfg.levels), qTime:cfg.qTime, mTime:cfg.mTime},
    teams,
    companies: COMPANIES.map(c => ({id:c.id, price:c.price, base:c.price, prev:c.price, lastR:0, hist:[c.price]})),
    news: [], lastNews: [], qLevel:null,
  };
  S.news = genNews();
  save();
}
const priceOf = id => S.companies.find(c => c.id === id).price;
function stockValue(t){ let v=0; for(const id in t.holdings) v += t.holdings[id]*priceOf(id); return v; }
const wealth = t => t.cash + stockValue(t);
const curTeam = () => S.teams[S.cur];

/* مكافأة ثابتة لكل مستوى يحددها المنظم قبل البداية؛ المنظم يختار مستوى السؤال عند تسجيل الإجابة الصحيحة */
function answer(correct){
  if(S.phase !== "question" || S.qLevel==null) return;
  const t = curTeam(), amt = correct ? S.cfg.rewards[S.qLevel] : 0;
  t.cash += amt;
  S.lastReward = {correct, amt, level:S.qLevel+1, before:t.cash-amt};
  S.phase = "reward"; S.qLevel = null;
  save();
}
function toMarket(){
  if(S.phase !== "reward") return;
  S.phase = "market"; S.movesLeft = MAX_MOVES; S.traded = []; save();
}
/* أثر التداول الفوري: كل 300 ريال تداول تحرك السهم 1% (حد أقصى 8%)، وحركة لا تقل عن ريال واحد.
   تُنفَّذ العملية بالسعر بعد الأثر، حتى لا تربح المجموعة من حركة سهم صنعتها بنفسها. */
const IMPACT_PER = 300, IMPACT_MAX = 0.08;
const bounds = c => [Math.round(c.base*0.45), Math.round(c.base*2.4)];
function impactPrice(id, qty, side){
  const c = S.companies.find(x=>x.id===id), p = c.price;
  const pct = Math.min(IMPACT_MAX, (p*qty)/IMPACT_PER/100);
  const d = Math.max(1, Math.round(p*pct));
  const [lo, hi] = bounds(c);
  return clamp(side==="buy" ? p+d : p-d, lo, hi);
}
const tradedNow = id => (S.traded||[]).includes(id);
function applyTrade(id, np){
  const c = S.companies.find(x=>x.id===id);
  c.price = np; (S.traded = S.traded||[]).push(id);
}
function buy(id, qty){
  qty = Math.floor(qty);
  if(S.phase!=="market") return {ok:false, msg:"التداول متاح في مرحلة السوق فقط"};
  if(S.movesLeft<=0) return {ok:false, msg:"انتهت الحركات المتاحة لهذا الدور"};
  if(!(qty>=1)) return {ok:false, msg:"حدد عدد أسهم صحيحًا"};
  if(tradedNow(id)) return {ok:false, msg:"لا يمكن تنفيذ حركتين على السهم نفسه في الدورة"};
  const t = curTeam(), from = priceOf(id), np = impactPrice(id, qty, "buy"), cost = np*qty;
  if(cost > t.cash) return {ok:false, msg:"الرصيد غير كافٍ لإتمام العملية"};
  t.cash -= cost; t.holdings[id] = (t.holdings[id]||0) + qty; applyTrade(id, np); S.movesLeft--; save();
  return {ok:true, cost, from, to:np};
}
function sell(id, qty){
  qty = Math.floor(qty);
  if(S.phase!=="market") return {ok:false, msg:"التداول متاح في مرحلة السوق فقط"};
  if(S.movesLeft<=0) return {ok:false, msg:"انتهت الحركات المتاحة لهذا الدور"};
  if(!(qty>=1)) return {ok:false, msg:"حدد عدد أسهم صحيحًا"};
  const t = curTeam(), have = t.holdings[id]||0;
  if(have<=0) return {ok:false, msg:"لا تملك المجموعة أسهمًا في هذه الشركة"};
  if(qty>have) return {ok:false, msg:"الكمية أكبر مما تملكه المجموعة ("+have+" سهم)"};
  if(tradedNow(id)) return {ok:false, msg:"لا يمكن تنفيذ حركتين على السهم نفسه في الدورة"};
  const from = priceOf(id), np = impactPrice(id, qty, "sell"), rev = np*qty;
  t.cash += rev; t.holdings[id] = have-qty; if(!t.holdings[id]) delete t.holdings[id]; applyTrade(id, np); S.movesLeft--; save();
  return {ok:true, rev, from, to:np};
}
function endTurn(){
  if(S.phase!=="market") return;
  if(S.cur < S.teams.length-1){ S.cur++; S.phase="question"; S.lastReward=null; S.qLevel=null; }
  else { updateMarket(); S.phase="marketUpdate"; }
  save();
}
/* تحديث السوق بعد كل دورة: ميل صاعد + تذبذب أعلى (الهبوط أخف من الصعود) + زخم + عودة ضعيفة للمتوسط + أثر الأخبار */
const DRIFT = 0.012;
function updateMarket(){
  const mkt = gauss()*0.006, news = S.news || [];
  const rs = S.companies.map(c => {
    const dev = (c.price - c.base)/c.base, g = gauss();
    const noise = g>0 ? g*0.035 : g*0.028;
    let r = clamp(0.20*c.lastR - 0.08*dev + DRIFT + mkt + noise, -0.12, 0.15);
    news.forEach(n => { if(n.co===null || n.co===c.id) r += n.eff*(0.8+Math.random()*0.4); });
    return clamp(r, -0.25, 0.30);
  });
  S.lastNews = news.map(n=>({...n}));
  S.lastChanges = S.companies.map((c,i) => {
    const [lo, hi] = bounds(c);
    let np = Math.round(c.price*(1+rs[i]));
    if(np===c.price && Math.abs(rs[i])>=0.003) np += rs[i]>0 ? 1 : -1;  // لا نبتلع الحركة الحقيقية بالتقريب
    np = clamp(np, lo, hi);
    const ch = {id:c.id, from:c.price, to:np, nw:news.find(n=>n.co===c.id)||null};
    c.prev = c.price; c.lastR = (np - c.price)/c.price; c.price = np; c.hist.push(np);
    return ch;
  });
}
function startNextRound(){
  if(S.phase!=="marketUpdate") return;
  S.round++; S.cur=0; S.phase="question"; S.lastReward=null; S.qLevel=null; S.news = genNews(); save();
}
function finishGame(){
  const rows = S.teams.map(t => {
    const sv = stockValue(t);
    return {name:t.name, cashBefore:t.cash, stocks:sv, total:t.cash+sv};
  });
  // تصفية جميع المحافظ بالسعر الحالي
  S.teams.forEach(t => { t.cash += stockValue(t); t.holdings = {}; });
  rows.sort((a,b)=>b.total-a.total);
  S.final = rows; S.phase = "finished"; save();
}
function ranking(){ return S.teams.map((t,i)=>({t, i, w:t.cash})).sort((a,b)=>b.w-a.w || a.i-b.i); }

function countUp(el, from, to, ms=900){
  if(!el) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = now => { const p = Math.min(1,(now-t0)/ms), e = 1-Math.pow(1-p,3);
    el.textContent = fmt(from + (to-from)*e); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const RIYAL = `<small>ريال</small>`;
function chgBadge(from, to){
  if(from===to) return `<span class="chg flat"><span class="num">0.0%</span></span>`;
  const p = (to-from)/from*100, up = p>0;
  return `<span class="chg ${up?"up":"down"}">${up?"↑":"↓"} <span class="num">${up?"+":"−"}${Math.abs(p).toFixed(1)}%</span></span>`;
}

function sparkline(c){
  const last = c.hist[c.hist.length-1];
  const pts = c.price===last ? c.hist.slice() : c.hist.concat([c.price]);
  if(pts.length<2) return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true"><path d="M0 13 L100 13" style="stroke:var(--line)"></path></svg>`;
  const mn = Math.min(...pts), mx = Math.max(...pts), rg = (mx-mn)||1;
  const x = i => (i/(pts.length-1))*100, y = v => 24 - ((v-mn)/rg)*22;
  const d = pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  const up = pts[pts.length-1] >= pts[0], col = up ? "var(--up)" : "var(--down)";
  return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true">
    <path class="area" d="${d} L100 26 L0 26 Z" style="fill:${col}"></path>
    <path d="${d}" style="stroke:${col}"></path></svg>`;
}
let lastTapeHtml = "", lastNewsHtml = "";
function renderTape(){
  const el = document.getElementById("tape");
  if(S && S.phase==="finished"){ el.innerHTML = ""; lastTapeHtml = ""; return; }
  const list = S ? S.companies : COMPANIES.map(c => ({id:c.id, price:c.price, prev:c.price}));
  const items = list.map(c => {
    const meta = COMPANIES.find(x=>x.id===c.id), diff = c.price - c.prev;
    const cls = diff>0?"up":diff<0?"down":"flat", sign = diff>0?"▲":diff<0?"▼":"■";
    const pct = c.prev ? (diff/c.prev*100) : 0;
    return `<span class="it"><span>${meta.ic} ${meta.name}</span><span class="p num">${fmt(c.price)}</span><span class="d ${cls}">${sign} <span class="num">${pct>0?"+":pct<0?"−":""}${Math.abs(pct).toFixed(1)}%</span></span></span>`;
  }).join("");
  const html = `<div class="run">${items}${items}</div>`;
  if(html !== lastTapeHtml){ el.innerHTML = html; lastTapeHtml = html; }  // لا نعيد تشغيل الحركة إلا عند تغيّر الأسعار
}
function renderNews(){
  const el = document.getElementById("news");
  const on = S && S.news && S.news.length && ["order","question","reward","market","marketUpdate"].includes(S.phase);
  if(!on){ el.hidden = true; el.innerHTML = ""; lastNewsHtml = ""; return; }
  el.hidden = false;
  const items = S.news.map(n => {
    return `<span class="it"><span class="bul"></span><span>${esc(n.text)}</span></span>`;
  }).join("");
  const html = `<span class="lbl">أخبار السوق</span><div class="scroll"><div class="run">${items}${items}</div></div>`;
  if(html !== lastNewsHtml){ el.innerHTML = html; lastNewsHtml = html; }
}
function render(){ renderInner(); requestAnimationFrame(fit); }
function renderInner(){
  const inGame = S && ["order","question","reward","market","marketUpdate"].includes(S.phase);
  endBtn.hidden = !inGame;
  roundPill.innerHTML = inGame && S.phase!=="order" ? `<span class="round-pill">الدورة <span class="num">${S.round}</span></span>` : "";
  renderTape(); renderNews();
  if(!S || S.phase==="setup") return renderSetup();
  if(S.phase==="order") return renderOrder();
  if(S.phase==="finished") return renderFinal();
  renderGame();
}

/* ---------- الإعداد ---------- */
function nameFields(n){
  let f = "";
  for(let i=0;i<n;i++) f += `<label class="name-field"><span class="num">${i+1}</span><input data-i="${i}" maxlength="30" placeholder="المجموعة ${i+1}" value="${esc(UI.setupNames[i]||"")}"></label>`;

function rewardFields(){
  let f = "";
  for(let i=0;i<UI.cfg.levels;i++) f += `<label class="fld"><span class="lvl ${lvCls(UI.cfg.levels,i)}">${lvName(UI.cfg.levels,i)}</span><input data-lv="${i}" class="num" type="number" min="10" step="10" inputmode="numeric" value="${UI.cfg.rewards[i]}"></label>`;
  return f;
}
function renderSetup(){
  const n = UI.setupCount, c = UI.cfg;
  while(UI.setupNames.length < n) UI.setupNames.push("");
  app.innerHTML = `<section class="setup"><div class="panel">
    <h2>إعداد سوق أسهم صقيل</h2>
    <p class="lead">حدّد المجموعات وقواعد المسابقة، وسيرتّب النظام أدوار المجموعات عشوائيًا عند البدء.</p>

    <div class="setup-cols"><div>
    <h3 class="sec">المجموعات</h3>
    <div class="count-row"><label for="cnt">عدد المجموعات</label>
      <div class="stepper"><button id="cMinus" aria-label="إنقاص">−</button>
      <input id="cnt" class="num" type="number" min="${MIN_G}" max="${MAX_G}" value="${n}">
      <button id="cPlus" aria-label="زيادة">+</button></div>
      <span style="color:var(--muted)">من ${MIN_G} إلى ${MAX_G}</span></div>
    <div class="names">${nameFields(n)}</div>

    </div><div>
    <h3 class="sec">الرصيد والمكافآت</h3>
    <div class="cfg-grid">
      <label class="fld"><span>الرصيد الافتتاحي (ريال)</span><input id="cCash" class="num" type="number" min="100" step="100" inputmode="numeric" value="${c.cash}"></label>
      <div class="fld wide"><span>عدد مستويات الأسئلة</span><div class="seg" id="lSeg"><button data-n="1">مستوى واحد</button><button data-n="2">مستويان</button><button data-n="3">ثلاثة مستويات</button></div></div>
    </div>
    <p class="sub">المبلغ الممنوح عن كل إجابة صحيحة في كل مستوى (ريال)</p>
    <div class="cfg-grid" id="lvGrid">${rewardFields()}</div>

    <h3 class="sec">الأوقات</h3>
    <div class="cfg-grid">
      <label class="fld"><span>وقت الإجابة (ثانية)</span><input id="cQ" class="num" type="number" min="0" max="900" inputmode="numeric" value="${c.qTime}"><small>0 يعني بلا وقت</small></label>
      <label class="fld"><span>وقت البيع والشراء (ثانية)</span><input id="cM" class="num" type="number" min="0" max="900" inputmode="numeric" value="${c.mTime}"><small>0 يعني بلا وقت</small></label>
    </div>

    </div></div>
    <div class="setup-actions">
      <button class="btn big amber" id="startBtn">بدء السوق</button>
      <button class="btn big ghost" id="howBtn">طريقة اللعب</button>
    </div>
  </div></section>`;
  const refreshNames = () => {
    const m = UI.setupCount;
    while(UI.setupNames.length < m) UI.setupNames.push("");
    app.querySelector(".names").innerHTML = nameFields(m);
    app.querySelector("#cnt").value = m;
    app.querySelector("#cMinus").disabled = m<=MIN_G;
    app.querySelector("#cPlus").disabled = m>=MAX_G;
    app.querySelectorAll(".name-field input").forEach(inp => inp.oninput = e => UI.setupNames[+e.target.dataset.i] = e.target.value);
  };
  const setCount = v => { UI.setupCount = clamp(Math.floor(+v)||MIN_G, MIN_G, MAX_G); refreshNames(); };
  const bindRewards = () => app.querySelectorAll("#lvGrid input").forEach(inp => inp.oninput = e => UI.cfg.rewards[+e.target.dataset.lv] = Math.floor(+e.target.value)||0);
  const setLevels = v => {
    UI.cfg.levels = [1,2,3].includes(v) ? v : 3;
    app.querySelectorAll("#lSeg button").forEach(b => b.classList.toggle("on", +b.dataset.n===UI.cfg.levels));
    app.querySelector("#lvGrid").innerHTML = rewardFields(); bindRewards();
  };
  app.querySelector("#cMinus").onclick = () => setCount(UI.setupCount-1);
  app.querySelector("#cPlus").onclick = () => setCount(UI.setupCount+1);
  app.querySelector("#cnt").onchange = e => setCount(e.target.value);
  app.querySelectorAll("#lSeg button").forEach(b => b.onclick = () => setLevels(+b.dataset.n));
  app.querySelector("#cCash").oninput = e => UI.cfg.cash = Math.floor(+e.target.value)||0;
  app.querySelector("#cQ").oninput = e => UI.cfg.qTime = Math.floor(+e.target.value)||0;
  app.querySelector("#cM").oninput = e => UI.cfg.mTime = Math.floor(+e.target.value)||0;
  refreshNames(); setLevels(c.levels);
  app.querySelector("#howBtn").onclick = showHow;
  app.querySelector("#startBtn").onclick = () => {
    const names = [], n = UI.setupCount, cf = UI.cfg;
    for(let i=0;i<n;i++){ const v=(UI.setupNames[i]||"").trim(); names.push(v || `المجموعة ${i+1}`); }
    const dup = names.find((x,i)=>names.indexOf(x)!==i);
    if(dup){ toast(`الاسم «${dup}» مكرر، غيّره ثم ابدأ`, "err"); return; }
    if(!(cf.cash>=100)){ toast("الرصيد الافتتاحي لا يقل عن 100 ريال", "err"); return; }
    for(let i=0;i<cf.levels;i++) if(!(cf.rewards[i]>=10)){ toast(`مكافأة المستوى ${i+1} لا تقل عن 10 ريال`, "err"); return; }
    if(cf.qTime<0||cf.qTime>900||cf.mTime<0||cf.mTime>900){ toast("الوقت من 0 إلى 900 ثانية", "err"); return; }
    newGame(names, cf); UI.sel=null; UI.timer=null; render();
  };
}

function showHow(){
  const root = document.getElementById("modalRoot"), c = S ? S.cfg : UI.cfg;
  const rw = c.rewards.slice(0,c.levels).map((a,i)=>`${lvName(c.levels,i)}: <span class="num">${fmt(a)}</span>`).join(" • ");
  const tm = x => x ? `<span class="num">${x}</span> ثانية` : "بلا وقت";
  root.innerHTML = `<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal how">
    <h4>طريقة اللعب</h4>
    <ol>
      <li>تبدأ كل مجموعة برصيد <b><span class="num">${fmt(c.cash)}</span> ريال</b>، ويرتّب النظام أدوار المجموعات عشوائيًا مرة واحدة، ويبقى الترتيب ثابتًا حتى نهاية اللعبة.</li>
      <li>في بداية دور كل مجموعة تختار مستوى السؤال، ويبدأ العداد فور الاختيار ثم يطرح المشرف السؤال شفهيًا. الإجابة الصحيحة تمنح مكافأة ثابتة بحسب المستوى (${rw} ريال)، والخاطئة لا تمنح شيئًا. وقت الإجابة: ${tm(c.qTime)}، وعند انتهائه لا تُسجَّل إجابة صحيحة.</li>
      <li>تنتقل المجموعة بعدها إلى السوق، ولها <b>حركتان</b> كحد أقصى في دورها. كل عملية شراء أو بيع حركة واحدة مهما كان عدد الأسهم. وقت البيع والشراء: ${tm(c.mTime)}، وعند انتهائه ينتهي دور المجموعة تلقائيًا.</li>
      <li>لا يُسمح بتنفيذ حركتين على الشركة نفسها في الدور الواحد.</li>
      <li>الشراء يرفع سعر السهم والبيع يخفضه مباشرة بحسب حجم العملية، وتُنفَّذ العملية بالسعر بعد التغير، ويظهر «سعر التنفيذ» قبل التأكيد.</li>
      <li>يعرض شريط الأخبار أخبار الدورة دون تحديد الشركة أو الاتجاه، ومن المجموعات أن تستنتج أثرها. تتحرك أسعار الشركات المعنية في تحديث السوق بحسب مضمون الخبر، ويميل السوق عمومًا إلى الصعود مع تذبذب أكبر، وبعض الأخبار بلا أثر.</li>
      <li>بعد انتهاء جميع المجموعات من الدورة، تتحدّث أسعار السوق كلها، ثم تبدأ دورة جديدة بالترتيب نفسه وبأخبار جديدة.</li>
      <li>عند الضغط على <b>إنهاء اللعبة</b> تُباع أسهم جميع المجموعات بالأسعار الحالية، والفائز صاحب أعلى رصيد نهائي.</li>
    </ol>
    <div class="note">لوحة الترتيب الجانبية تعرض السيولة النقدية فقط، ولا تعرض قيمة الأسهم المملوكة، فقد يتغير الترتيب كثيرًا عند التصفية النهائية. الأخبار في اللعبة افتراضية.</div>
    <div class="acts" style="margin-top:20px"><button class="btn" id="mClose">إغلاق</button></div>
  </div></div>`;
  const close = () => root.innerHTML = "";
  root.querySelector("#mClose").onclick = close;
  root.querySelector(".modal-bg").onclick = e => { if(e.target.classList.contains("modal-bg")) close(); };
  root.querySelector("#mClose").focus();
}

/* ---------- ترتيب المجموعات ---------- */
function renderOrder(){
  app.innerHTML = `<section class="setup"><div class="stage stage-enter">
    <div class="meta">تم ترتيب المجموعات عشوائيًا</div>
    <div class="team-name" style="font-size:clamp(2rem,4vw,3rem)">ترتيب الأدوار</div>
    <ol class="order-list">${S.teams.map((t,i)=>`<li style="animation-delay:${i*70}ms"><b class="num">${i+1}</b>${esc(t.name)}</li>`).join("")}</ol>
    <button class="btn big amber" id="go">بدء الدورة الأولى</button>
  </div></section>`;
  app.querySelector("#go").onclick = () => { S.phase="question"; save(); render(); };
}

/* ---------- اللعب ---------- */
function orderStrip(){
  return `<div class="order-strip">${S.teams.map((t,i)=>`<span class="${i<S.cur?"done":i===S.cur?"now":""}">${esc(t.name)}</span>`).join("")}</div>`;
}
function metaLine(){
  return `<div class="meta"><span>الدورة <span class="num">${S.round}</span></span><span class="sep">|</span><span>المجموعة <span class="num">${S.cur+1}</span> من <span class="num">${S.teams.length}</span></span></div>`;
}
let lastStageKey = "";
function renderGame(){
  let stage = ""; UI.extra = "";
  if(S.phase==="question") stage = stageQuestion();
  else if(S.phase==="reward") stage = stageReward();
  else if(S.phase==="market") stage = stageMarket();
  else if(S.phase==="marketUpdate") stage = stageUpdate();
  const key = S.phase+"|"+S.round+"|"+S.cur;
  const enter = key!==lastStageKey && (S.phase==="question" || S.phase==="marketUpdate");
  lastStageKey = key;
  app.innerHTML = `<div class="game"><section class="stage ${S.phase==="market"?"mk":""} ${enter?"stage-enter":""}" id="stage">${stage}</section><aside class="side"><div class="board" id="board"></div>${UI.extra||""}</aside></div>`;
  renderBoard();
  bindStage();
}
function renderBoard(flashId){
  const b = document.getElementById("board"); if(!b) return;
  const cur = S.phase!=="marketUpdate" ? curTeam().id : null;
  b.innerHTML = `<h3>ترتيب المجموعات <small>بالسيولة</small></h3><ol>${ranking().map((r,k)=>
    `<li class="${r.t.id===cur?"cur":""} ${r.t.id===flashId?"flash":""}"><span class="rk num">${k+1}</span><span class="tn">${esc(r.t.name)}</span><span class="tw num">${fmt(r.w)}</span></li>`).join("")}</ol>`;
  const ol = b.querySelector("ol"), cr = b.querySelector("li.cur"); if(cr) ol.scrollTop = Math.max(0, cr.offsetTop - ol.clientHeight/2);
}
function pickLevel(i){ if(S.phase!=="question") return; S.qLevel = i; save(); if(S.cfg.qTime) startTimer("q"); render(); }
function stageQuestion(){
  const t = curTeam(), c = S.cfg, lv = S.qLevel;
  const head = `${metaLine()}${orderStrip()}<div class="team-name">${esc(t.name)}</div>`;
  const bal = `<div><div class="bal-label">الرصيد الحالي</div><div class="bal"><span class="num">${fmt(wealth(t))}</span>${RIYAL}</div></div>`;
  if(lv==null && c.levels===1){ S.qLevel = 0; save(); if(c.qTime) curTimer("q"); return stageQuestion(); }
  if(lv==null){
    const btns = c.rewards.map((amt,i)=>`<button class="lvbtn ${lvCls(c.levels,i)}" data-lv="${i}"><span class="ln">${lvName(c.levels,i)}</span><span class="la">+<span class="num">${fmt(amt)}</span> <small>ريال</small></span></button>`).join("");
    return `${head}<div class="qrow">${bal}</div>
      <div class="pick-title">اختاروا مستوى السؤال${c.qTime?` <small>ويبدأ العداد فور الاختيار (<span class="num">${c.qTime}</span> ثانية)</small>`:""}</div>
      <div class="lv-btns">${btns}</div>`;
  }
  const expired = !!(c.qTime && curTimer("q").expired);
  return `${head}
    <div class="qrow">${bal}<div class="lvchip ${lvCls(c.levels,lv)}">${c.levels===1?"المكافأة":lvName(c.levels,lv)} • +<span class="num">${fmt(c.rewards[lv])}</span> ريال</div></div>
    ${timerHtml("q")}
    <div class="answer-btns two">
      <button class="abtn ok" id="aOk" ${expired?"disabled":""}><i>✓</i> إجابة صحيحة</button>
      <button class="abtn no" id="aNo"><i>✕</i> إجابة خاطئة</button>
    </div>
    ${expired?`<div class="hint">انتهى وقت الإجابة، سجّل الإجابة خاطئة.</div>`:""}`;
}
function stageReward(){
  const t = curTeam(), r = S.lastReward;
  const anim = UI.animReward; 
  const amtHtml = r.correct
    ? `<div class="amount pop" id="rAmt"><span class="num">+<span id="rNum">${anim?"0":fmt(r.amt)}</span></span></div>`
    : `<div class="amount zero pop">لا مكافأة هذه المرة</div>`;
  return `${metaLine()}${orderStrip()}
    <div class="team-name" style="font-size:clamp(2rem,4vw,3rem)">${esc(t.name)}</div>
    <div class="reward">
      <div class="label">${r.correct?`${S.cfg.levels===1?"مكافأة الإجابة الصحيحة":"مكافأة سؤال "+lvName(S.cfg.levels, r.level-1)}`:"إجابة خاطئة"}</div>
      ${amtHtml}
      <div class="newbal">الرصيد الآن: <b class="num" id="rBal">${fmt(anim ? wealth(t)-r.amt : wealth(t))}</b> ريال</div>
    </div>
    <div class="center-actions"><button class="btn big amber" id="toMk">الانتقال إلى السوق</button></div>`;
}
function stageMarket(){
  const t = curTeam(), sv = stockValue(t);
  const used = MAX_MOVES - S.movesLeft;
  const cos = S.companies.map(c => {
    const meta = COMPANIES.find(x=>x.id===c.id), own = t.holdings[c.id]||0;
    const chg = c.hist.length===1 && c.price===c.prev ? `<span class="chg flat">سعر الافتتاح</span>` : chgBadge(c.prev, c.price);
    const lock = tradedNow(c.id);
    return `<button class="co ${UI.sel===c.id?"sel":""} ${lock?"lock":""}" data-co="${c.id}" ${lock?"disabled":""}>
      <span class="nm"><span class="ic" aria-hidden="true">${meta.ic}</span>${meta.name}</span>
      <span class="pr"><span class="num">${fmt(c.price)}</span> <small>ريال</small></span>
      ${chg}
      ${sparkline(c)}
      ${lock?`<span class="lk">تم التداول عليه هذه الدورة</span>`:""}
      <span class="own">${own?`تملكون <b class="num">${own}</b> سهم • <b class="num">${fmt(own*c.price)}</b>`:"لا تملكون أسهمًا"}</span>
    </button>`;
  }).join("");
  let panel = "";
  if(S.movesLeft<=0) panel = `<div class="hint">استُخدمت الحركتان. اضغط «إنهاء دور المجموعة» للانتقال إلى المجموعة التالية.</div>`;
  else if(!UI.sel) panel = `<div class="hint">اختر شركة لتنفيذ عملية شراء أو بيع. كل عملية حركة واحدة، ولا يُسمح بحركتين على السهم نفسه في الدورة. الشراء يرفع سعر السهم والبيع يخفضه بحسب حجم العملية.</div>`;
  else panel = tradePanel();
  UI.extra = panel;
  return `${metaLine()}
    <div class="mk-head"><div class="team-name">${esc(t.name)}</div>${timerHtml("m")}<button class="btn amber" id="endTurn">إنهاء دور المجموعة</button></div>
    <div class="stats">
      <div class="stat"><div class="k">النقد المتوفر</div><div class="v num" id="sCash">${fmt(t.cash)}</div></div>
      <div class="stat"><div class="k">قيمة الأسهم</div><div class="v num">${fmt(sv)}</div></div>
      <div class="stat hl"><div class="k">إجمالي الثروة</div><div class="v num">${fmt(t.cash+sv)}</div></div>
      <div class="stat"><div class="k">الحركات المتبقية</div><div class="v"><span class="num">${S.movesLeft}</span> من <span class="num">${MAX_MOVES}</span></div>
        <div class="moves-dots">${Array.from({length:MAX_MOVES},(_,i)=>`<b class="${i<used?"used":""}"></b>`).join("")}</div></div>
    </div>
    <div class="market-area"><div class="cos">${cos}</div></div>`;
}
function tradePanel(){
  const t = curTeam(), c = S.companies.find(x=>x.id===UI.sel), meta = COMPANIES.find(x=>x.id===c.id);
  const own = t.holdings[c.id]||0;
  return `<div class="trade" id="trade">
    <div><div class="tco">${meta.ic} ${meta.name}</div>
      <div class="tsub">سعر السهم <b class="num">${fmt(c.price)}</b> ريال • تملكون <b class="num">${own}</b> سهم</div></div>
    <div class="seg" role="tablist">
      <button class="buy ${UI.mode==="buy"?"on":""}" data-mode="buy">شراء</button>
      <button class="sell ${UI.mode==="sell"?"on":""}" data-mode="sell">بيع</button>
    </div>
    <div class="qty">
      <div class="stepper"><button id="qMinus" aria-label="إنقاص">−</button>
        <input id="qty" class="num" type="number" min="1" value="${UI.qty}" inputmode="numeric" aria-label="عدد الأسهم">
        <button id="qPlus" aria-label="زيادة">+</button></div>
      <button class="max" id="qMax">الحد الأقصى</button>
      <div class="total"><div class="k" id="tLbl"></div><div class="v"><span class="num" id="tVal"></span> <small style="font-size:.55em">ريال</small></div><div class="err" id="tErr"></div></div>
    </div>
    <button class="btn exec ${UI.mode}" id="exec">${UI.mode==="buy"?"تنفيذ الشراء":"تنفيذ البيع"}</button>
  </div>`;
}
function maxQty(){
  const t = curTeam(), p = priceOf(UI.sel);
  if(UI.mode!=="buy") return t.holdings[UI.sel]||0;
  let q = Math.floor(t.cash/p);
  while(q>0 && impactPrice(UI.sel,q,"buy")*q > t.cash) q--;
  return q;
}
function updatePreview(){
  const t = curTeam(), p = priceOf(UI.sel), q = UI.qty;
  const np = q>=1 ? impactPrice(UI.sel, q, UI.mode) : p, total = np*Math.max(q,0);
  document.getElementById("tLbl").textContent = (UI.mode==="buy" ? "تكلفة الشراء" : "قيمة البيع") + ` • سعر التنفيذ ${fmt(np)}`;
  document.getElementById("tVal").textContent = fmt(total);
  let err = "";
  if(!(q>=1)) err = "حدد عدد أسهم صحيحًا";
  else if(UI.mode==="buy" && total>t.cash) err = "الرصيد غير كافٍ لإتمام العملية";
  else if(UI.mode==="sell" && q>(t.holdings[UI.sel]||0)) err = (t.holdings[UI.sel]||0) ? "الكمية أكبر مما تملكه المجموعة" : "لا تملك المجموعة أسهمًا في هذه الشركة";
  document.getElementById("tErr").textContent = err;
  document.getElementById("exec").disabled = !!err;
}
function stageUpdate(){
  if(UI.updPending){
    return `<div class="upd-title">تحديث السوق</div><div class="upd-sub">انتهت الدورة <span class="num">${S.round}</span>… يجري احتساب الأسعار الجديدة</div><div class="scan"><i></i></div>`;
  }
  const items = S.lastChanges.map((ch,i) => {
    const meta = COMPANIES.find(x=>x.id===ch.id);
    return `<div class="upd" style="animation-delay:${i*60}ms"><div class="nm">${meta.ic} ${meta.name}</div>
      <div class="pr"><span class="num">${fmt(ch.to)}</span> <small style="font-size:.55em;color:var(--muted)">ريال</small></div>
      <div class="path">كان <span class="num">${fmt(ch.from)}</span></div>${chgBadge(ch.from,ch.to)}
      </div>`;
  }).join("");
  const news = (S.lastNews||[]).map(n => {
    const meta = n.co ? COMPANIES.find(x=>x.id===n.co) : null;
    const mark = n.up===null ? `<span class="dot"></span>` : `<span class="dot ${n.up?"up":"down"}"></span>`;
    return `<li>${mark}<b>${meta?meta.name:(n.up===null?"بلا أثر":"السوق كله")}</b><span>${esc(n.text)}</span></li>`;
  }).join("");
  UI.extra = news ? `<div class="newsbox"><h4>أخبار الدورة وأثرها على الأسعار</h4><ul>${news}</ul></div>` : "";
  return `<div class="upd-title">تحديث السوق</div><div class="upd-sub">أسعار الشركات بعد نهاية الدورة <span class="num">${S.round}</span></div>
    <div class="upd-grid">${items}</div>
    <div class="center-actions"><button class="btn big amber" id="nextRound">بدء الدورة <span class="num">${S.round+1}</span></button></div>`;
}

/* ---------- المؤقتات (يحددها المنظم؛ 0 = بلا وقت) ---------- */
const fmtTime = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const timerTotal = kind => kind==="q" ? S.cfg.qTime : S.cfg.mTime;
const timerKey = kind => kind+"|"+S.round+"|"+S.cur;
function curTimer(kind){
  if(!UI.timer || UI.timer.key!==timerKey(kind)) UI.timer = {kind, key:timerKey(kind), end:null, expired:false};
  return UI.timer;
}
function startTimer(kind){ const T = curTimer(kind); T.end = Date.now()+timerTotal(kind)*1000; T.expired = false; }
function timerHtml(kind){
  const total = timerTotal(kind); if(!total) return "";
  const T = curTimer(kind), label = kind==="q" ? "وقت الإجابة" : "وقت البيع والشراء", base = kind==="q" ? "tmr big" : "tmr lg";
  if(T.expired) return `<div class="${base} crit" data-b="${base}" id="tmr"><span class="tl">${label}</span><span class="t">انتهى الوقت</span></div>`;
  if(!T.end) return `<div class="${base}" data-b="${base}" id="tmr"><span class="tl">${label}</span><span class="t num">${fmtTime(total)}</span><button class="tbtn" id="tmrStart">ابدأ الوقت</button></div>`;
  const left = Math.max(0, T.end-Date.now());
  return `<div class="${base} ${left<=5000?"crit":left<=10000?"warn":""}" data-b="${base}" id="tmr"><span class="tl">${label}</span><span class="t num" id="tmrT">${fmtTime(Math.ceil(left/1000))}</span><span class="bar"><i id="tmrB" style="width:${left/(total*10)}%"></i></span></div>`;
}
function onTimeUp(kind){
  if(kind==="q"){ toast("انتهى وقت الإجابة", "err"); render(); }
  else { doEndTurn(true); }
}
setInterval(() => {
  const T = UI.timer;
  if(!S || !T || !T.end || T.expired) return;
  const active = S.phase==="question" ? "q" : S.phase==="market" ? "m" : null;
  if(T.kind!==active || T.key!==timerKey(T.kind)){ UI.timer = null; return; }
  const total = timerTotal(T.kind)*1000, left = T.end-Date.now();
  if(left<=0){ T.expired = true; T.end = null; onTimeUp(T.kind); return; }
  const t = document.getElementById("tmrT"), b = document.getElementById("tmrB"), box = document.getElementById("tmr");
  if(t) t.textContent = fmtTime(Math.ceil(left/1000));
  if(b) b.style.width = (left/total*100)+"%";
  if(box) box.className = box.dataset.b+" "+(left<=5000?"crit":left<=10000?"warn":"");
}, 200);
function doEndTurn(auto){
  if(!S || S.phase!=="market") return;
  const name = curTeam().name, last = S.cur===S.teams.length-1;
  endTurn(); UI.sel = null; UI.timer = null;
  if(auto) toast(`انتهى وقت البيع والشراء لـ ${name}`, "err");
  if(last){ UI.updPending = true; render(); setTimeout(()=>{ UI.updPending=false; render(); }, 1600); }
  else { if(!auto) toast(`انتهى دور ${name}`); render(); }
}

function bindStage(){
  const $ = s => app.querySelector(s);
  const ts = $("#tmrStart"); if(ts) ts.onclick = () => { startTimer(S.phase==="question"?"q":"m"); render(); };
  if(S.phase==="question"){
    app.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => pickLevel(+b.dataset.lv));
    const ok = $("#aOk"), no = $("#aNo");
    if(ok) ok.onclick = () => { answer(true); UI.animReward = true; render(); playReward(); };
    if(no) no.onclick = () => { answer(false); UI.animReward = false; render(); };
  }
  if(S.phase==="reward"){
    $("#toMk").onclick = () => { toMarket(); UI.sel=null; UI.qty=1; UI.mode="buy"; if(S.cfg.mTime) startTimer("m"); render(); };
  }
  if(S.phase==="market"){
    app.querySelectorAll("[data-co]").forEach(b => b.onclick = () => {
      if(S.movesLeft<=0 || tradedNow(b.dataset.co)) return;
      UI.sel = b.dataset.co; UI.qty = 1;
      const own = curTeam().holdings[UI.sel]||0; if(!own) UI.mode="buy";
      render();
    });
    $("#endTurn").onclick = () => doEndTurn(false);
    if(UI.sel && S.movesLeft>0){
      app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { UI.mode=b.dataset.mode; UI.qty=1; render(); });
      const q = $("#qty");
      const setQ = v => { UI.qty = Math.max(1, Math.floor(+v)||1); q.value = UI.qty; updatePreview(); };
      $("#qMinus").onclick = () => setQ(UI.qty-1);
      $("#qPlus").onclick = () => setQ(UI.qty+1);
      $("#qMax").onclick = () => { const m = maxQty(); if(m<1){ toast(UI.mode==="buy"?"الرصيد غير كافٍ لشراء سهم واحد":"لا تملك المجموعة أسهمًا في هذه الشركة","err"); return;} setQ(m); };
      q.oninput = () => { UI.qty = Math.floor(+q.value)||0; updatePreview(); };
      q.onkeydown = e => { if(e.key==="Enter" && !$("#exec").disabled) $("#exec").click(); };
      $("#exec").onclick = () => {
        const meta = COMPANIES.find(x=>x.id===UI.sel), qty = UI.qty, tid = curTeam().id;
        const r = UI.mode==="buy" ? buy(UI.sel, qty) : sell(UI.sel, qty);
        if(!r.ok){ toast(r.msg, "err"); return; }
        toast(UI.mode==="buy" ? `تم شراء ${qty} سهم من ${meta.name} بـ ${fmt(r.cost)} ريال • السهم ${fmt(r.from)} ← ${fmt(r.to)}` : `تم بيع ${qty} سهم من ${meta.name} بـ ${fmt(r.rev)} ريال • السهم ${fmt(r.from)} ← ${fmt(r.to)}`, "ok");
        UI.qty = 1; UI.sel = null;
        render(); renderBoard(tid);
      };
      updatePreview();
    }
  }
  if(S.phase==="marketUpdate" && !UI.updPending){
    $("#nextRound").onclick = () => { startNextRound(); render(); };
  }
}
function playReward(){
  const r = S.lastReward, t = curTeam(), n = document.getElementById("rNum"), bal = document.getElementById("rBal");
  if(!n){ UI.animReward=false; return; }
  countUp(n, 0, r.amt, 700);
  setTimeout(() => { countUp(bal, wealth(t)-r.amt, wealth(t)); renderBoard(t.id); UI.animReward=false; }, 750);
}

/* ---------- النهاية ---------- */
function renderFinal(){
  const f = S.final, top = f[0], ties = f.filter(r=>r.total===top.total);
  app.innerHTML = `<section class="final">
    <div class="stage winner stage-enter">
      <div class="cup" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M14 8h20l9 11-19 22L5 19z" fill="#EAF3FB"/><path d="M5 19h38M14 8l5 11 5 22 5-22 5-11M19 19 24 8l5 11"/></svg></div>
      <div class="lbl">${ties.length>1?"تعادل في المركز الأول":"المجموعة الفائزة"}</div>
      <div class="wn">${ties.map(r=>esc(r.name)).join(" و ")}</div>
      <div class="bal-label">الرصيد النهائي</div>
      <div class="wb"><span class="num" id="wBal">0</span> ريال</div>
    </div>
    <div class="ranking"><h3>الترتيب النهائي</h3>
      ${f.map((r,i)=>{ const pos = f.findIndex(x=>x.total===r.total)+1;
        return `<div class="rk-row"><span class="p num">${pos}</span><span class="n">${esc(r.name)}<small>نقد <span class="num">${fmt(r.cashBefore)}</span> + تصفية أسهم <span class="num">${fmt(r.stocks)}</span></small></span><span class="b"><span class="num">${fmt(r.total)}</span> ريال</span></div>`;}).join("")}
    </div>
    <div class="center-actions"><button class="btn big amber" id="again">لعبة جديدة</button></div>
  </section>`;
  countUp(document.getElementById("wBal"), 0, top.total, 1400);
  app.querySelector("#again").onclick = () => { clearSave(); S=null; UI.setupNames = []; render(); };
}

/* ---------- الاستئناف ---------- */
function renderResume(saved){
  const phaseName = {order:"ترتيب المجموعات", question:"مرحلة السؤال", reward:"مرحلة المكافأة", market:"مرحلة السوق", marketUpdate:"تحديث السوق"}[saved.phase]||"";
  app.innerHTML = `<section class="setup"><div class="panel">
    <h2>يوجد سوق محفوظ</h2>
    <p class="lead"><span class="num">${saved.teams.length}</span> مجموعات • الدورة <span class="num">${saved.round}</span> • ${phaseName}${saved.phase!=="marketUpdate"&&saved.phase!=="order"?` • دور ${esc(saved.teams[saved.cur].name)}`:""}</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn big amber" id="resume">استكمال اللعبة</button>
      <button class="btn big ghost" id="fresh">بدء لعبة جديدة</button>
    </div></div></section>`;
  app.querySelector("#resume").onclick = () => { S = saved; render(); };
  app.querySelector("#fresh").onclick = () => modal({
    title:"بدء لعبة جديدة؟", text:"سيُحذف السوق المحفوظ نهائيًا، ولا يمكن استرجاعه.",
    okText:"نعم، ابدأ من جديد", onOk:()=>{ clearSave(); S=null; render(); }
  });
}

/* ---------- أزرار عامة ---------- */
endBtn.onclick = () => modal({
  title:"هل تريد إنهاء اللعبة؟",
  text:"سيتم بيع جميع الأسهم لدى جميع المجموعات بالأسعار الحالية واحتساب الرصيد النهائي.",
  okText:"نعم، إنهاء اللعبة", onOk:()=>{ UI.updPending=false; finishGame(); render(); }
});
document.getElementById("fsBtn").onclick = () => {
  const d = document;
  if(!d.fullscreenElement){ (d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen||(()=>{})).call(d.documentElement); }
  else { (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
};


/* ملاءمة الشاشة: إن زاد المحتوى عن ارتفاع الشاشة يُصغَّر تلقائيًا ليظهر كاملًا دون تمرير */
function fit(){
  const wrap = document.querySelector(".wrap"), cs = getComputedStyle(wrap);
  app.style.zoom = 1;
  const avail = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom), h = app.scrollHeight;
  if(h > avail) app.style.zoom = Math.max(0.5, avail/h - 0.004);
}
window.addEventListener("resize", fit);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

/* ---------- تشغيل ---------- */
(function init(){
  const saved = load();
  if(saved && saved.v===2 && saved.phase==="finished"){ S = saved; render(); return; }
  if(saved && saved.v===2 && saved.teams && saved.phase!=="setup"){ renderResume(saved); return; }
  render();
})();
window.__saqeel = { get S(){return S}, answer, toMarket, buy, sell, endTurn, updateMarket, startNextRound, finishGame, stockValue, wealth };
</script>
</body>
